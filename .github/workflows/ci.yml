name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y libpcap-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # tests/live.rs captures in a user and network namespace; Ubuntu forbids them by default
      - if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo TCPFLOW_REQUIRE_NAMESPACES=1 >> $GITHUB_ENV
      - run: cargo test

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y libpcap-dev
      - run: cargo build --release
      - run: python3 -I tests/scripts/conformance.py check target/release/tcpflow

  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y libpcap-dev
      - run: cargo build --release
      - run: sudo sh tests/scripts/privs-root.sh
