[package]
name = "tcpflow"
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.85"
description = "Captures TCP connections and stores each flow in its own file"
license = "GPL-3.0-only"
repository = "https://github.com/simsong/tcpflow"
readme = "README.md"

[dependencies]
lexopt = "0.3"
libc = "0.2"
pcap = "2.5"

[profile.release]
lto = true
